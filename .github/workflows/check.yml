name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Verify MoonBit version
        run: |
          expected_version="0.1.20260827"
          installed_version="$(moon version | sed -nE '1s/^moon ([^ ]+).*/\1/p')"
          test "$installed_version" = "$expected_version"

      - name: moon check
        run: |
          moon update
          moon check --target js

      - name: moon test
        run: moon test

      - name: Verify generated interface and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
